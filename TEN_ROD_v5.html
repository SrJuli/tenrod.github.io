<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEN ROD v5</title>
<style>
body{margin:0;font-family:Arial;background:#f3f3f3;color:#222}header{background:#111;color:white;padding:20px;border-bottom:4px solid #f57c00}.wrap{max-width:1100px;margin:auto;padding:0 16px}.logo{font-size:30px;font-weight:bold}.sub{color:#bbb;font-size:12px}.banner{margin:15px 0;padding:10px;background:#222;color:white;border-radius:8px}.banner b{color:#f57c00}.box,.card{background:white;padding:18px;border-radius:12px;box-shadow:0 2px 8px #0001}.search{width:100%;padding:15px;font-size:17px;border:2px solid #ddd;border-radius:8px}.buttons{margin-top:10px;display:flex;gap:10px}.buttons button,button{padding:10px;border:0;border-radius:8px;background:#f57c00;color:white;font-weight:bold;cursor:pointer}.mode{margin-top:12px;padding:12px;background:#fafafa;border-radius:8px}.hidden{display:none}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.fields>*{padding:10px;border:1px solid #ccc;border-radius:7px}.markup{margin:15px 0;padding:12px;background:#fff2df;border:1px solid #ffd099;border-radius:10px}.markup input{width:70px;padding:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.photo{height:160px;background:#eee;border-radius:8px;overflow:hidden;cursor:zoom-in}.photo img{width:100%;height:100%;object-fit:cover}.brand{color:#e66f00;font-weight:bold}.old{text-decoration:line-through;color:#777}.price{font-size:23px;font-weight:bold}.bulk{background:#fff0dc;padding:10px;border-radius:8px;margin-top:8px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%}.green{background:#20a84b}.yellow{background:#e0b600}.red{background:#d33}.cart{width:100%;margin-top:10px}.modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:5}.modal.open{display:flex}.modal img{max-width:90%;max-height:88%}.close{position:absolute;right:20px;top:5px;background:none;font-size:40px}.cartbox{position:fixed;right:18px;bottom:18px;background:#111;color:white;padding:12px 16px;border-radius:10px}.cartbox b{color:#f57c00}@media(max-width:650px){.fields{grid-template-columns:1fr 1fr}}
</style></head><body>
<header><div class="wrap"><div class="logo">TEN ROD</div><div class="sub">Tensores · Rodamientos · Catálogo online</div></div></header>
<main class="wrap"><div class="banner">🟧 <b>OFERTA TEN ROD</b> · Consultá promociones y disponibilidad.</div>
<section class="box"><h2>🔎 Buscar rodamiento</h2><input id="q" class="search" placeholder="Número, equivalencia, marca o aplicación..." oninput="quick()">
<div class="buttons"><button onclick="mode('v')">🚗 Buscar por vehículo</button><button onclick="mode('m')">📏 Buscar por medidas</button></div>
<div id="v" class="mode hidden"><div class="fields"><select id="brand" onchange="models()"><option>Marca</option><option>Ford</option><option>Chevrolet</option><option>Renault</option></select><select id="model" onchange="vehicle()"><option>Modelo</option></select><select id="type" onchange="vehicle()"><option value="">Qué buscás</option><option>Rulemán de rueda</option><option>Rulemán de alternador</option><option>Rulemán de tensor</option></select><select id="pos" onchange="vehicle()"><option value="">Ubicación</option><option>Delantera</option><option>Trasera</option></select></div></div>
<div id="m" class="mode hidden"><div class="fields"><input id="i" placeholder="Interior mm"><input id="e" placeholder="Exterior mm"><input id="w" placeholder="Ancho mm"><button onclick="measure()">Buscar</button></div></div></section>
<div class="markup">💰 <b>Recargo para venta:</b> <input id="mk" type="number" value="30" min="0" oninput="show(current)"> % — se aplica a todos los precios.</div>
<h2>📦 Resultados <small id="count"></small></h2><div id="results" class="grid"></div></main>
<div class="cartbox">🛒 Carrito: <b id="cc">0</b></div>
<div id="modal" class="modal" onclick="closeImg(event)"><button class="close">×</button><img id="big"></div>
<script>
const P=[
{n:"12025",b:"SKF",e:"12025-2RS",d:"Rulemán de rueda",i:25,o:52,w:15,l:18500,disc:20,s:12,v:["Renault Clio","Chevrolet Corsa"],p:["Delantera","Trasera"],img:"https://placehold.co/900x600?text=12025+SKF"},
{n:"12025",b:"NTN",e:"12025-2RS",d:"Rulemán de rueda",i:25,o:52,w:15,l:17200,disc:15,s:5,v:["Renault Clio","Chevrolet Corsa"],p:["Delantera"],img:"https://placehold.co/900x600?text=12025+NTN"},
{n:"84690",b:"SKF",e:"84690",d:"Rulemán de rueda",i:30,o:62,w:16,l:8996,disc:20,s:18,bulk:{qty:10,extra:5},v:["Renault Clio","Chevrolet Corsa"],p:["Delantera"],img:"https://placehold.co/900x600?text=84690+SKF"},
{n:"6203",b:"SKF",e:"6203-2RS",d:"Rulemán de alternador",i:17,o:40,w:12,l:12500,disc:20,s:20,v:["Ford Fiesta"],p:["Delantera"],img:"https://placehold.co/900x600?text=6203+SKF"}];
let current=P,cart=0;
const money=x=>"$"+Math.round(x).toLocaleString("es-AR"),net=p=>p.l*(1-p.disc/100);
function show(a){current=a;let mk=+document.getElementById("mk").value||0;document.getElementById("results").innerHTML=a.length?a.map(p=>{let base=net(p),stock=p.s?(p.s<=5?"yellow":"green"):"red";return `<article class="card"><div class="photo" onclick="openImg('${p.img}')"><img src="${p.img}"></div><h2>${p.n}</h2><div class="brand">${p.b}</div><p>Equivalencia: <b>${p.e}</b><br>Aplicación: <b>${p.d}</b><br>Medidas: <b>${p.i} × ${p.o} × ${p.w} mm</b><br>Vehículos: <b>${p.v.join(", ")}</b></p><span class="old">${money(p.l)}</span><br>Tu precio (${p.disc}% descuento): <span class="price">${money(base)}</span><p><span class="dot ${stock}"></span> ${p.s?(p.s<=5?"Stock bajo":"Hay stock"):"Sin stock"}</p>${p.bulk?`<div class="bulk">🔥 Por ${p.bulk.qty} unidades: ${p.bulk.extra}% adicional.</div>`:""}<div>Venta sugerida: <b>${money(base*(1+mk/100))}</b></div><button class="cart" ${p.s?"onclick='add()'":"disabled"}>${p.s?"🛒 Agregar al carrito":"Sin stock"}</button></article>`}).join(""):"<div class='card'>No encontramos productos.</div>";document.getElementById("count").textContent="("+a.length+")"}
function add(){cart++;document.getElementById("cc").textContent=cart}
function quick(){let q=document.getElementById("q").value.toLowerCase();show(q?P.filter(p=>(p.n+" "+p.b+" "+p.e+" "+p.d+" "+p.v.join(" ")+" "+p.i+" "+p.o+" "+p.w).toLowerCase().includes(q)):P)}
function mode(x){v.classList.toggle("hidden",x!="v");m.classList.toggle("hidden",x!="m")}
function models(){let x=brand.value,ms={Ford:["Fiesta","Focus","Ka"],Chevrolet:["Corsa","Onix","Cruze"],Renault:["Clio","Sandero","Logan","Duster"]};model.innerHTML="<option>Modelo</option>"+(ms[x]||[]).map(a=>"<option>"+a+"</option>").join("");vehicle()}
function vehicle(){let x=model.value;if(x=="Modelo")return show(P);show(P.filter(p=>p.v.some(v=>v.includes(x))&&(!type.value||p.d==type.value)&&(!pos.value||p.p.includes(pos.value))))}
function measure(){show(P.filter(p=>(!i.value||p.i==i.value)&&(!e.value||p.o==e.value)&&(!w.value||p.w==w.value)))}
function openImg(x){big.src=x;modal.classList.add("open")}function closeImg(e){if(e.target.id=="modal"||e.target.className=="close")modal.classList.remove("open")}
show(P);
</script></body></html>
