<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEN ROD v6</title><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><style>
body{margin:0;font-family:Arial;background:#f3f3f3;color:#222}header{background:#111;color:#fff;padding:18px;border-bottom:4px solid #f57c00}.wrap{max-width:1100px;margin:auto;padding:0 16px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:30px;font-weight:bold}.sub{color:#bbb;font-size:12px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#f57c00;color:#fff;font-weight:bold;cursor:pointer}.banner{margin:14px 0;padding:10px;background:#222;color:#fff;border-radius:8px}.banner b{color:#f57c00}.box,.card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 8px #0001}.search{width:100%;padding:15px;font-size:17px;border:2px solid #ddd;border-radius:8px;box-sizing:border-box}.actions{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}.actions button{padding:10px;border:1px solid #ccc;background:#fafafa;border-radius:8px;cursor:pointer}.mode{margin-top:12px;padding:12px;background:#fafafa;border-radius:8px}.fields{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.fields>*{padding:10px;border:1px solid #ccc;border-radius:7px;box-sizing:border-box}.hidden{display:none}.markup{margin:15px 0;padding:12px;background:#fff2df;border:1px solid #ffd099;border-radius:10px}.markup input{width:70px;padding:8px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px}.photo{height:160px;background:#eee;border-radius:8px;overflow:hidden;cursor:zoom-in}.photo img{width:100%;height:100%;object-fit:cover}.brand{color:#e66f00;font-weight:bold}.old{text-decoration:line-through;color:#777}.price{font-size:23px;font-weight:bold}.bulk{background:#fff0dc;padding:10px;border-radius:8px;margin-top:8px}.dot{display:inline-block;width:12px;height:12px;border-radius:50%}.green{background:#20a84b}.yellow{background:#e0b600}.red{background:#d33}.cart{width:100%;margin-top:10px;background:#f57c00;color:#fff;border:0;border-radius:8px;padding:10px;font-weight:bold}.cart:disabled{background:#aaa}.cartbox{position:fixed;right:18px;bottom:18px;background:#111;color:#fff;padding:12px 16px;border-radius:10px}.cartbox b{color:#f57c00}.overlay{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;z-index:10}.panel{background:#fff;padding:22px;border-radius:12px;width:min(550px,90vw)}.file{width:100%;padding:14px;box-sizing:border-box}.close{float:right;border:0;background:none;font-size:28px;cursor:pointer}.status{margin-top:12px;padding:10px;border-radius:8px;background:#eee}.ok{background:#e6f7eb;color:#176b35}.err{background:#ffe7e7;color:#9b2222}.modal img{max-width:90vw;max-height:85vh}.x{position:absolute;right:20px;top:5px;background:none;border:0;color:white;font-size:40px}
@media(max-width:650px){.fields{grid-template-columns:1fr 1fr}.top{gap:10px}}
</style></head><body>
<header><div class="wrap top"><div><div class="logo">TEN ROD</div><div class="sub">Tensores · Rodamientos · Catálogo online</div></div><button class="btn" onclick="admin()">🔐 Administrador</button></div></header>
<main class="wrap"><div class="banner">🟧 <b>TEN ROD</b> · Catálogo actualizado desde Excel.</div>
<section class="box"><h2>🔎 Buscar rodamiento</h2><input id="q" class="search" placeholder="Número, equivalencia, marca o aplicación..." oninput="quick()"><div class="actions"><button onclick="mode('v')">🚗 Buscar por vehículo</button><button onclick="mode('m')">📏 Buscar por medidas</button></div>
<div id="v" class="mode hidden"><div class="fields"><select id="brand" onchange="models()"><option>Marca</option></select><select id="model" onchange="vehicle()"><option>Modelo</option></select><select id="type" onchange="vehicle()"><option value="">Qué buscás</option></select><select id="pos" onchange="vehicle()"><option value="">Ubicación</option></select></div></div>
<div id="m" class="mode hidden"><div class="fields"><input id="i" placeholder="Interior mm"><input id="e" placeholder="Exterior mm"><input id="w" placeholder="Ancho mm"><button onclick="measure()">Buscar</button></div></div></section>
<div class="markup">💰 <b>Recargo para venta:</b> <input id="mk" type="number" value="30" min="0" oninput="show(current)"> %</div>
<h2>📦 Resultados <small id="count"></small></h2><div id="results" class="grid"></div></main>
<div class="cartbox">🛒 Carrito: <b id="cc">0</b></div>
<div id="admin" class="overlay"><div class="panel"><button class="close" onclick="closeAdmin()">×</button><h2>🔐 Administrador TEN ROD</h2><p>Seleccioná el Excel para actualizar el catálogo.</p><input id="file" class="file" type="file" accept=".xlsx,.xls,.csv" onchange="loadExcel(event)"><div id="status" class="status">Esperando archivo...</div><p><b>Hoja recomendada:</b> Productos</p></div></div>
<div id="imgmodal" class="overlay" onclick="closeImg(event)"><button class="x">×</button><img id="big" class="modal"></div>
<script>
let P=[{n:"12025",b:"SKF",e:"12025-2RS",d:"Rulemán de rueda",i:25,o:52,w:15,l:18500,disc:20,s:12,sm:5,dc:0,cm:0,v:["Renault Clio"],p:["Delantera"],img:"12025-skf.jpg"},{n:"12025",b:"NTN",e:"12025-2RS",d:"Rulemán de rueda",i:25,o:52,w:15,l:17200,disc:15,s:5,sm:5,dc:0,cm:0,v:["Chevrolet Corsa"],p:["Delantera"],img:"12025-ntn.jpg"},{n:"84690",b:"SKF",e:"84690",d:"Rulemán de rueda",i:30,o:62,w:16,l:8996,disc:20,s:18,sm:5,dc:5,cm:10,v:["Renault Clio","Chevrolet Corsa"],p:["Delantera"],img:"84690-skf.jpg"},{n:"6203",b:"SKF",e:"6203-2RS",d:"Rulemán de alternador",i:17,o:40,w:12,l:12500,disc:20,s:20,sm:5,dc:0,cm:0,v:["Ford Fiesta"],p:["Delantera"],img:"6203-skf.jpg"}];let current=P,cart=0;
const money=x=>"$"+Math.round(Number(x)||0).toLocaleString("es-AR"),net=p=>p.l*(1-(p.disc||0)/100);
function src(x){return x?(x.startsWith("http")?x:"FOTOS/"+x):"https://placehold.co/900x600?text=Sin+foto"}
function show(a){current=a;let mk=+document.getElementById("mk").value||0;document.getElementById("results").innerHTML=a.length?a.map(p=>{let c=!p.s?"red":p.s<=(p.sm||5)?"yellow":"green";return `<article class="card"><div class="photo" onclick="openImg('${src(p.img)}')"><img src="${src(p.img)}" onerror="this.src='https://placehold.co/900x600?text=Sin+foto'"></div><h2>${p.n}</h2><div class="brand">${p.b}</div><p>Equivalencia: <b>${p.e}</b><br>Aplicación: <b>${p.d}</b><br>Medidas: <b>${p.i} × ${p.o} × ${p.w} mm</b><br>Vehículos: <b>${(p.v||[]).join(", ")}</b></p><span class="old">${money(p.l)}</span><br>Tu precio: <span class="price">${money(net(p))}</span><p><span class="dot ${c}"></span> ${!p.s?"Sin stock":p.s<=(p.sm||5)?"Stock bajo":"Hay stock"}</p>${p.dc&&p.cm?`<div class="bulk">🔥 Desde ${p.cm} unidades: ${p.dc}% adicional.</div>`:""}<p>Venta sugerida: <b>${money(net(p)*(1+mk/100))}</b></p><button class="cart" ${p.s?"onclick='add()'":"disabled"}>${p.s?"🛒 Agregar al carrito":"Sin stock"}</button></article>`}).join(""):"<div class='card'>No encontramos productos.</div>";document.getElementById("count").textContent="("+a.length+")"}
function add(){cart++;document.getElementById("cc").textContent=cart}
function quick(){let q=document.getElementById("q").value.toLowerCase().trim();show(q?P.filter(p=>(p.n+" "+p.b+" "+p.e+" "+p.d+" "+(p.v||[]).join(" ")+" "+p.i+" "+p.o+" "+p.w).toLowerCase().includes(q)):P)}
function mode(x){v.classList.toggle("hidden",x!="v");m.classList.toggle("hidden",x!="m")}
function models(){let b=brand.value,vals=[...new Set(P.filter(p=>!b||p.b==b).flatMap(p=>p.v||[]))];model.innerHTML="<option>Modelo</option>"+vals.map(x=>"<option>"+x+"</option>").join("");vehicle()}
function vehicle(){let b=brand.value,m=model.value,t=type.value,z=pos.value;show(P.filter(p=>(b=="Marca"||p.b==b)&&(m=="Modelo"||(p.v||[]).includes(m))&&(!t||p.d==t)&&(!z||(p.p||[]).includes(z))))}
function measure(){let a=i.value,e=e.value,w=w.value;show(P.filter(p=>(!a||p.i==a)&&(!e||p.o==e)&&(!w||p.w==w)))}
function admin(){document.getElementById("admin").style.display="flex"}function closeAdmin(){document.getElementById("admin").style.display="none"}
function openImg(x){big.src=x;imgmodal.style.display="flex"}function closeImg(e){if(e.target.id=="imgmodal"||e.target.className=="x")imgmodal.style.display="none"}
function loadExcel(ev){let f=ev.target.files[0],st=document.getElementById("status");if(!f)return;st.className="status";st.textContent="Cargando...";let r=new FileReader();r.onload=e=>{try{let wb=XLSX.read(new Uint8Array(e.target.result),{type:"array"}),sn=wb.SheetNames.includes("Productos")?"Productos":wb.SheetNames[0],rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:""});if(!rows.length)throw Error("La hoja está vacía");P=rows.map(r=>({n:String(r.Numero||""),b:String(r.Marca||""),e:String(r.Equivalencia||""),d:String(r.Aplicacion||r.Descripcion||""),i:+r.Interior_mm||0,o:+r.Exterior_mm||0,w:+r.Ancho_mm||0,l:+r.Precio_Lista||0,disc:+r["Descuento_%"]||0,s:+r.Stock||0,sm:+r.Stock_Minimo||5,dc:+r["Desc_Cantidad_%"]||0,cm:+r.Cant_Minima||0,img:String(r.Foto||""),v:String(r.Vehiculo||"").split(",").map(x=>x.trim()).filter(Boolean),p:String(r.Posicion||"").split(",").map(x=>x.trim()).filter(Boolean)})).filter(p=>p.n);build();show(P);st.className="status ok";st.textContent="✅ Excel cargado. "+P.length+" productos."; }catch(x){st.className="status err";st.textContent="❌ "+x.message}};r.readAsArrayBuffer(f)}
function build(){let bs=[...new Set(P.map(p=>p.b).filter(Boolean))],ts=[...new Set(P.map(p=>p.d).filter(Boolean))],ps=[...new Set(P.flatMap(p=>p.p||[]).filter(Boolean))];brand.innerHTML="<option>Marca</option>"+bs.map(x=>"<option>"+x+"</option>").join("");type.innerHTML='<option value="">Qué buscás</option>'+ts.map(x=>"<option>"+x+"</option>").join("");pos.innerHTML='<option value="">Ubicación</option>'+ps.map(x=>"<option>"+x+"</option>").join("")}
build();show(P);
</script></body></html>
